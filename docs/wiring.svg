<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 680" width="1420" height="680" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<defs><style>.t{fill:#E6EDF3}.m{fill:#8B949E}.f{fill:#6E7681}.pin{font-size:13px}.lbl{font-size:12px}.board{fill:#161B22;stroke:#30363D;stroke-width:1.5;rx:10}.wire{stroke-width:2.4;fill:none;stroke-linecap:round}</style></defs>
<rect width="1420" height="680" fill="#0D1117"/>
<text x="46" y="56" class="t" font-size="21" font-weight="600">ESP32 CAN logger — wiring</text>
<text x="46" y="80" class="m" font-size="13">MCP2515 on VSPI · SD card on HSPI · two independent buses, so SD writes never stall CAN reception</text>
<line x1="46" y1="98" x2="1374" y2="98" stroke="#30363D" stroke-width="1"/>
<rect x="250" y="160" width="250" height="276" class="board"/>
<text x="375.0" y="186" class="t" font-size="14.5" font-weight="600" text-anchor="middle">MCP2515 + TJA1050</text>
<text x="375.0" y="205" class="f" font-size="11" text-anchor="middle">CAN controller</text>
<rect x="640" y="150" width="260" height="286" class="board"/>
<text x="770.0" y="176" class="t" font-size="14.5" font-weight="600" text-anchor="middle">ESP32 DevKit v1</text>
<text x="770.0" y="195" class="f" font-size="11" text-anchor="middle">30-pin</text>
<rect x="1040" y="178" width="250" height="241" class="board"/>
<text x="1165.0" y="204" class="t" font-size="14.5" font-weight="600" text-anchor="middle">Micro-SD module</text>
<text x="1165.0" y="223" class="f" font-size="11" text-anchor="middle">SPI, 3V3 logic</text>
<path d="M 500 196 H 640" class="wire" stroke="#F85149"/>
<circle cx="500" cy="196" r="4.2" fill="#F85149"/>
<text x="487" y="200.5" class="pin t" text-anchor="end">VCC</text>
<circle cx="640" cy="196" r="4.2" fill="#F85149"/>
<text x="653" y="200.5" class="pin t" text-anchor="start">3V3</text>
