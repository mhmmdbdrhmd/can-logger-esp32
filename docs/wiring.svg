<text x="395" y="900" class="lbl m" text-anchor="middle">shared VSPI &#183; GPIO 18/19/23 &#8212; only CS and INT are unique per controller</text>
<text x="1355" y="526" class="lbl m" text-anchor="middle">HSPI &#183; GPIO 14/27/13</text>
<line x1="46" y1="936" x2="1474" y2="936" stroke="#30363D" stroke-width="1"/>
<line x1="46" y1="966" x2="72" y2="966" class="wire" stroke="#F85149"/>
<text x="80" y="970.5" class="lbl m">3V3</text>
<line x1="138.8" y1="966" x2="164.8" y2="966" class="wire" stroke="#F0883E"/>
<text x="172.8" y="970.5" class="lbl m">5V</text>
<line x1="224" y1="966" x2="250" y2="966" class="wire" stroke="#6E7681"/>
<text x="258" y="970.5" class="lbl m">GND</text>
<line x1="316.8" y1="966" x2="342.8" y2="966" class="wire" stroke="#F59E0B"/>
<text x="350.8" y="970.5" class="lbl m">CS</text>
<line x1="402" y1="966" x2="428" y2="966" class="wire" stroke="#A78BFA"/>
<text x="436" y="970.5" class="lbl m">INT</text>
