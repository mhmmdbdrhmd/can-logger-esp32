<text x="528.8" y="970.5" class="lbl m">SCK</text>
<line x1="587.6" y1="966" x2="613.6" y2="966" class="wire" stroke="#3FB950"/>
<text x="621.6" y="970.5" class="lbl m">MISO</text>
<line x1="688" y1="966" x2="714" y2="966" class="wire" stroke="#FF7B72"/>
<text x="722" y="970.5" class="lbl m">MOSI</text>
<line x1="788.4" y1="966" x2="814.4" y2="966" class="wire" stroke="#2DD4BF"/>
<text x="822.4" y="970.5" class="lbl m">CAN1</text>
<line x1="888.8" y1="966" x2="914.8" y2="966" class="wire" stroke="#E879F9"/>
<text x="922.8" y="970.5" class="lbl m">CAN2</text>
<text x="46" y="1008" class="lbl t" font-weight="600">Two MCP2515s on one SPI bus.</text>
<text x="258.4" y="1008" class="lbl m">MISO tri-states while CS is high, so both controllers share D18/D19/D23. Each needs its own CS and its own INT &#8212; and keep the shared stubs short.</text>
<text x="46" y="1030" class="lbl t" font-weight="600">A dot is a join, a hop is not.</text>
<text x="273" y="1030" class="lbl m">Where a wire arcs over another they are separate nets that merely cross on the page. Only the filled dots on the vertical runs are places the two controllers share</text>
<text x="273" y="1048" class="lbl m">one wire.</text>
<text x="46" y="1070" class="lbl t" font-weight="600">Check each crystal separately.</text>
<text x="273" y="1070" class="lbl m">8 MHz or 16 MHz, per board &#8212; two modules from one order can differ. Set CAN1_CRYSTAL_MHZ and CAN2_CRYSTAL_MHZ in src/config.h. The wrong value reports &#8220;NO CAN</text>
<text x="273" y="1088" class="lbl m">TRAFFIC&#8221; on a perfectly healthy bus.</text>
<text x="46" y="1110" class="lbl t" font-weight="600">Power the SD module from VIN.</text>
<text x="265.7" y="1110" class="lbl m">Almost every breakout carries its own 3V3 regulator and wants 5 V. On 3V3 it browns out under write current and looks exactly like an empty slot. Card must be FAT32.</text>
<text x="46" y="1132" class="lbl t" font-weight="600">D22 and D21 are free here.</text>
<text x="243.8" y="1132" class="lbl m">Neither is a strapping pin, and unlike GPIO16/17 neither is taken by PSRAM on a WROVER module. They are the ESP32&#8217;s default I2C pins, unused in this project.</text>
<text x="46" y="1154" class="lbl t" font-weight="600">There is no pin marked D17.</text>
<text x="251.1" y="1154" class="lbl m">This board labels UART2 by function &#8212; TX2 is GPIO17, RX2 is GPIO16. CAN2&#8217;s INT goes to the pin silkscreened TX2. USB upload and the serial monitor run on UART0 and are</text>
<text x="251.1" y="1172" class="lbl m">unaffected.</text>
<text x="46" y="1194" class="lbl t" font-weight="600">One module is a valid build.</text>
<text x="258.4" y="1194" class="lbl m">Fit CAN1 only and the logger runs as a single-bus logger: the missing controller is reported once and skipped. Set CAN2_ENABLED 0 in src/config.h to stop it being</text>
<text x="258.4" y="1212" class="lbl m">looked for at all.</text>
</svg>