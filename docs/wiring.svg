<text x="46" y="56" class="t" font-size="21" font-weight="600">ESP32 dual-CAN logger &#8212; wiring</text>
<text x="46" y="80" class="m" font-size="13">Two MCP2515 controllers share VSPI (own CS + INT each) &#183; SD card alone on HSPI, so SD writes never stall CAN reception</text>
