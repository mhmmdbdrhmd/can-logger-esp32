<text x="88" y="313.5" class="pin" fill="#2DD4BF">120 &#937;</text>
<text x="64" y="262" class="lbl t" font-weight="600">to bus 1</text>
<text x="64" y="280" class="lbl f">CAN_H / CAN_L / GND</text>
<text x="64" y="362" class="lbl f">terminate only if the logger</text>
<text x="64" y="378" class="lbl f">sits at the end of this bus</text>
