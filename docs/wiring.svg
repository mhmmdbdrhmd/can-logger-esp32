<circle cx="500" cy="230" r="4.2" fill="#6E7681"/>
<text x="487" y="234.5" class="pin t" text-anchor="end">GND</text>
<circle cx="640" cy="230" r="4.2" fill="#6E7681"/>
<text x="653" y="234.5" class="pin t" text-anchor="start">GND</text>
<path d="M 500 264 H 640" class="wire" stroke="#F59E0B"/>
<circle cx="500" cy="264" r="4.2" fill="#F59E0B"/>
<text x="487" y="268.5" class="pin t" text-anchor="end">CS</text>
<circle cx="640" cy="264" r="4.2" fill="#F59E0B"/>
<text x="653" y="268.5" class="pin t" text-anchor="start">D5</text>
