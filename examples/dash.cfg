# CAN Logger dashboard
#
# A worked example to go with examples/machine.dbc. Copy BOTH files to the root
# of the SD card - the frame map as /frames.dbc and this as /dash.cfg - and the
# logger comes up with this dashboard already built.
#
# It is written the way the logger writes it, so it can be edited here or in
# the browser; whichever was touched last is the one that survives the next
# boot. See dash.h for the rule.
#
#   grid <cols> <rows>          the layout
#   poll <ms>                   how often the browser asks for values
#   cell <slot> widget=.. sig=Message.Signal lo=.. hi=..
#   send <n> label=".." sig=Message.Signal style=..
#
# widget is one of: gauge arc angle compass bar level thermo number spark state

version 1
grid 4 3
poll 200

cell 0 widget=gauge sig=Drive.GroundSpeed label="Ground speed" unit=km/h lo=0 hi=50 dec=1 warn=25 crit=40
cell 1 widget=angle sig=Steering.SteeringAngle label=Steering unit=deg lo=-45 hi=45 dec=1
cell 2 widget=gauge sig=Drive.EngineSpeed label=Engine unit=rpm lo=0 hi=3000 dec=0 warn=2400 crit=2800
cell 3 widget=state sig=Drive.Gear label=Gear

cell 4 widget=arc sig=Hydraulics.SystemPressure label="System pressure" unit=bar lo=0 hi=350 dec=0 warn=280 crit=330
cell 5 widget=thermo sig=Hydraulics.OilTemperature label="Hydraulic oil" unit=degC lo=-40 hi=120 dec=0 warn=85 crit=100
cell 6 widget=level sig=Hydraulics.OilLevel label="Oil level" unit=% lo=0 hi=100 dec=0 warn=40 crit=20 lowbad=1
cell 7 widget=level sig=Electrical.FuelLevel label=Fuel unit=% lo=0 hi=100 dec=0 warn=20 crit=10 lowbad=1

cell 8 widget=arc sig=Wheels.TyrePressFL label="Tyre front left" unit=bar lo=0 hi=8 dec=2 warn=3 crit=2 lowbad=1
cell 9 widget=arc sig=Wheels.TyrePressFR label="Tyre front right" unit=bar lo=0 hi=8 dec=2 warn=3 crit=2 lowbad=1
cell 10 widget=compass sig=Attitude.Heading label=Heading unit=deg lo=0 hi=360 dec=0
cell 11 widget=spark sig=Electrical.BatteryVoltage label=Battery unit=V lo=22 hi=32 dec=2 warn=24 crit=23 lowbad=1

# Values that can be written back. A tyre size is not something anyone should
# be typing next to a running machine, so it is the four sizes this fleet uses.
send 0 label="Tyre size" sig=MachineConfig.TyreSize unit=mm lo=400 hi=1400 step=1 preset=690 dec=0 style=choice choices="620:620 mm|650:650 mm|690:690 mm|710:710 mm"
send 1 label="Speed limit" sig=MachineConfig.SpeedLimit unit=km/h lo=0 hi=50 step=0.25 preset=8 dec=2 style=slider
send 2 label="Work mode" sig=MachineConfig.WorkMode lo=0 hi=3 step=1 preset=0 dec=0 style=enum
send 3 label="Weight calibration" sig=MachineConfig.WeightCalib unit=kg lo=-500 hi=500 step=0.1 preset=0 dec=1 style=number
