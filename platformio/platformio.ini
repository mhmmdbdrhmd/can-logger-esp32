; ============================================================================
;  can-logger-esp32 - PlatformIO build
;
;  Works identically on Windows, macOS and Linux. In VS Code with the
;  PlatformIO extension installed, open the FOLDER CONTAINING THIS FILE and use
;  the buttons in the blue status bar - no command line needed. See WINDOWS.md.
;
;  From a terminal, if you prefer:   pio run -t upload -t monitor
;
;  Sources are NOT duplicated here: src_dir points at ../src, the single
;  canonical copy. The Arduino IDE sketch folder is generated from the same
;  files by arduino/sync.sh.
;
;  No lib_deps: SPI, SD, WiFi, WebServer, ESPmDNS and ArduinoOTA all ship with
;  the Arduino-ESP32 framework, and the MCP2515 driver is part of this project
;  so the interrupt path is fully under our control.
; ============================================================================

[platformio]
src_dir = ../src

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200          ; must match SERIAL_BAUD in src/config.h
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; min_spiffs gives TWO 1.9 MB app slots, which is what makes OTA possible.
;
; Do NOT switch this to huge_app.csv: that has a single app slot and OTA cannot
; work, which on a board with a broken auto-reset means the only way to flash is
; a human holding the BOOT button.
;
; Arduino IDE equivalent, set by hand:
;   Tools > Partition Scheme > "Minimal SPIFFS (1.9MB APP with OTA/190KB SPIFFS)"
board_build.partitions = min_spiffs.csv

; ---------------------------------------------------------------------------
;  A note on IRAM, since it is easy to "fix" this with a flag that does nothing.
;
;  canIsr() in app.cpp is IRAM_ATTR, so our handler is resident. But
;  attachInterrupt() dispatches through the Arduino core's shared GPIO ISR,
;  which lives in the PRECOMPILED core library - whether that is in IRAM is
;  decided by CONFIG_ARDUINO_ISR_IRAM when the core was built, and adding
;  -DCONFIG_ARDUINO_ISR_IRAM here would NOT change it.
;
;  Normally this cannot bite, because the firmware writes no flash while
;  recording (WiFi.persistent(false) suppresses the NVS writes that would
;  otherwise happen on connect), so the cache is never disabled at runtime.
;
;  An OTA update is the one exception - it erases and rewrites flash while the
;  firmware is live. That is exactly why ArduinoOTA.onStart() in app.cpp
;  detaches the CAN interrupt before the update begins. Do not remove that, and
;  do not add NVS/Preferences/SPIFFS writes to the running path without
;  revisiting this.
; ---------------------------------------------------------------------------

; ===========================================================================
;  [env:ota] - upload over Wi-Fi, no cable and no BOOT button
;
;  Use this once a build with ENABLE_OTA has been flashed over USB even a
;  single time. From then on this is the normal way to work:
;
;      pio run -e ota -t upload
;
;  or in VS Code pick "ota" in the PlatformIO project environment switcher and
;  press the same arrow button as usual.
;
;  Set upload_port to whatever the serial log prints at boot:
;    - hotspot mode  -> 192.168.4.1 (join the logger's own network first)
;    - station mode  -> the address it got from your network, or
;                       can-logger.local
; ===========================================================================
[env:ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = 192.168.4.1
upload_flags    = --auth=canlogger      ; must match OTA_PASSWORD in config.h
